# =============================================================================
# CrowdStream — LOCAL development stack (hot reload)
#
#   cp deploy/env.docker.template backend/.env   # once, then edit secrets
#   docker compose -f docker-compose.local.yml up --build
#
# Then open http://localhost/  (nginx ingress -> Vite + backend).
#
# All services use host networking (matching infra/): they reach each other on
# 127.0.0.1:<port>. Backend & frontend source are bind-mounted for hot reload.
# =============================================================================

services:
  mongo:
    image: mongo:7
    container_name: crowdstream-mongo
    network_mode: host
    command: ["mongod", "--bind_ip", "127.0.0.1", "--port", "27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis-1:
    image: redis:7-alpine
    container_name: crowdstream-redis-1
    network_mode: host
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-1/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-1-data:/data
    restart: unless-stopped

  redis-2:
    image: redis:7-alpine
    container_name: crowdstream-redis-2
    network_mode: host
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-2/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-2-data:/data
    restart: unless-stopped

  redis-3:
    image: redis:7-alpine
    container_name: crowdstream-redis-3
    network_mode: host
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-3/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-3-data:/data
    restart: unless-stopped

  redis-4:
    image: redis:7-alpine
    container_name: crowdstream-redis-4
    network_mode: host
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-4/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-4-data:/data
    restart: unless-stopped

  redis-5:
    image: redis:7-alpine
    container_name: crowdstream-redis-5
    network_mode: host
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-5/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-5-data:/data
    restart: unless-stopped

  redis-6:
    image: redis:7-alpine
    container_name: crowdstream-redis-6
    network_mode: host
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis-6/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-6-data:/data
    restart: unless-stopped

  # One-shot: forms the cluster once all nodes are up (idempotent).
  redis-init:
    image: redis:7-alpine
    container_name: crowdstream-redis-init
    network_mode: host
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
    volumes:
      - ./deploy/redis/init-cluster.sh:/init-cluster.sh:ro
    entrypoint: ["sh", "/init-cluster.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      target: dev
    container_name: crowdstream-backend
    network_mode: host
    env_file:
      - ./backend/.env
    # These override backend/.env so the containerized infra is always used.
    environment:
      NODE_ENV: development
      PORT: "3000"
      INSTANCE_ID: node-1
      MONGO_DB_URL: mongodb://127.0.0.1:27017
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT1: "6379"
      REDIS_PORT2: "6380"
      REDIS_PORT3: "6381"
      PUBLIC_IP: "127.0.0.1"
      ANNOUCED_IP: "127.0.0.1"
      RECORDING_IP: "127.0.0.1"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: crowdstream-frontend
    network_mode: host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: crowdstream-nginx
    network_mode: host
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  mongo-data:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  redis-4-data:
  redis-5-data:
  redis-6-data:
