global
    description "CrowdStream NLB"

    nbthread 8
    cpu-map auto:1/1-8 0-7

    log stdout format raw local0

    stats socket /tmp/haproxy.sock mode 660 level admin

defaults
    log global

    mode tcp

    timeout connect 5s
    timeout client 30m
    timeout server 30m

    option tcplog

frontend turn_tcp
    bind *:3478
    default_backend turn_tcp_backend

backend turn_tcp_backend
    balance source

    server coturn1 127.0.0.1:3479 check
