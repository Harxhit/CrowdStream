global
    description "CrowdStream"

    nbthread 8
    cpu-map auto:1/1-8 0-7

    log stdout format raw local0

    stats socket /tmp/haproxy.sock mode 660 level admin

defaults
    log global

    timeout connect 5s
    timeout client 30m
    timeout server 30m

    option tcplog
    option httplog

frontend turn_tcp
    mode tcp
    bind :::${HAPROXY_TURN_TCP_PORT} v4v6
    default_backend turn_tcp_backend

backend turn_tcp_backend
    mode tcp
    balance source

    server coturn1 127.0.0.1:${COTURN_TCP_PROXY_PORT} send-proxy-v2 check

frontend signaling
    bind *:${HAPROXY_SIGNALING_PORT}
    mode http
    default_backend signaling_backend

backend signaling_backend
    mode http
    option httpchk GET /db/__ping
    http-check expect status 200

    cookie SERVER_USED insert indirect nocache
    dynamic-cookie-key ${HAPROXY_COOKIE_KEY}

    balance leastconn
    server s1 127.0.0.1:${BACKEND_PORT_1} cookie s1 check
    # server s2 127.0.0.1:${BACKEND_PORT_2} cookie s2 check