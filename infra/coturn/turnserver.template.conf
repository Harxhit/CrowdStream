# ==========================================================
# CrowdStream Coturn configuration (template)
# ==========================================================

# TURN realm.
realm=${TURN_REALM}

# Listeners. Envoy and HAProxy connect over loopback; the LAN and
# public IPv6 addresses are kept for direct testing.
listening-ip=${TURN_LAN_IPV4}
listening-ip=127.0.0.1
listening-ip=${TURN_PUBLIC_IPV6}

# Relay addresses. One per family, so the relay can reach both
# mediasoup candidates (IPv4 and IPv6).
relay-ip=${TURN_LAN_IPV4}
relay-ip=${TURN_PUBLIC_IPV6}

# TCP connections from HAProxy using PROXY protocol v2.
tcp-proxy-port=${TURN_TCP_PROXY_PORT}

# TLS (disabled for now).
# cert=${TURN_CERT_PATH}
# pkey=${TURN_KEY_PATH}
# tls-listening-port=${TURN_TLS_PORT}

# UDP TURN listener (Envoy forwards to this port).
listening-port=${TURN_LISTENING_PORT}

# Format: <public-ip>/<private-ip>
# external-ip=

# Include TURN fingerprints as recommended by RFC 5389.
fingerprint

# Shared-secret auth for time-limited HMAC credentials generated
# by the backend (/turn/credentials).
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Relay port range.
min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}

# Logging.
simple-log
verbose

# Nonce lifetime (seconds).
stale-nonce=${TURN_STALE_NONCE}