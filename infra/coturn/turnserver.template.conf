# ==========================================================
# CrowdStream Coturn Configuration
#
# This is a template file. Do NOT commit secrets.
# Generate turnserver.conf from this template by replacing
# the placeholders with values from your environment.
# ==========================================================

# TURN realm.
realm=${TURN_REALM}

# Network configuration.
listening-ip=${TURN_LISTENING_IP}
relay-ip=${TURN_RELAY_IP}

# TCP traffic arrives via HAProxy.
tcp-proxy-port=${TURN_TCP_PROXY_PORT}

# UDP traffic arrives via Envoy.
listening-port=${TURN_LISTENING_PORT}

# Format: <public-ip>/<private-ip>
external-ip=${TURN_EXTERNAL_IP}

# Include TURN fingerprints as recommended by RFC 5389.
fingerprint

# Enable shared-secret authentication for time-limited
# HMAC credentials generated by the backend.
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Relay port range.
min-port=${TURN_MIN_PORT}
max-port=${TURN_MAX_PORT}

# Logging.
simple-log
verbose

# Nonce lifetime (seconds).
stale-nonce=${TURN_STALE_NONCE}