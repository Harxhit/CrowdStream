services:
  envoy:
    image: envoyproxy/envoy:v1.38.3

    container_name: crowdstream-envoy

    network_mode: host

    restart: unless-stopped

    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro

    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - info