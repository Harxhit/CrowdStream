# Production ingress: serve the built SPA and reverse-proxy the API + Socket.IO
# to the backend. Runs with host networking, so the backend is at 127.0.0.1:3000.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API. Trailing slash strips the /backend/ prefix:
    #   /backend/api/v1/... -> /api/v1/... ; /backend/db/__ping -> /db/__ping
    location /backend/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO signaling (WebSocket upgrade + long-lived connections).
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
